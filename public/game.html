    if (dp>0) ctx.fillRect(12,74,Math.floor(dp*(236/6)),22);
    ctx.fillStyle='rgba(255,180,180,0.88)'; ctx.font='700 11px "Space Mono",monospace';
    ctx.fillText(`PRESSURE  ${dp}/6`,18,89);
  }
  if (MODE==='spaghetti') {
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(10,72,244,26);
    const chaosCol=spagChaos>0.7?`rgb(255,${Math.floor((1-spagChaos)*160)},0)`:'#cc3300';
    ctx.fillStyle=chaosCol; ctx.fillRect(12,74,Math.floor(240*spagChaos),22);
    ctx.fillStyle='rgba(255,180,80,0.88)'; ctx.font='700 11px "Space Mono",monospace';
    ctx.fillText('CHAOS',18,89);
    if (invertTimer>0) {
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(10,104,244,26);
      ctx.fillStyle='#ffaa00'; ctx.font='700 12px "Space Mono",monospace';
      ctx.fillText('CONTROLS INVERTED',18,120);
    }
  }

  /* death screen */
  if (state==='dead') {
    ctx.fillStyle='rgba(4,0,7,0.90)'; ctx.fillRect(0,0,W,H);
    const cx=W/2;
    const dieColor=MODE==='spaghetti'?'#ff4400':MODE==='time'?'#4499FF':'#E8447A';
    const mName=MODE==='dark'?'DARK MATTER':MODE==='spaghetti'?'SPAGHETTIFICATION':'TIME DILATION';
    let nextY=H*0.13;
    ctx.textAlign='center';
    /* YOU DIED */
    const dSz=Math.min(96,W*0.13);
    ctx.font=`${dSz}px "Bangers",cursive`;
    ctx.fillStyle='#000'; ctx.fillText('YOU DIED',cx+5,nextY+5);
    ctx.shadowColor=dieColor; ctx.shadowBlur=22; ctx.fillStyle=dieColor;
    ctx.fillText('YOU DIED',cx,nextY); ctx.shadowBlur=0;
    nextY+=Math.floor(dSz*0.70);
    /* mode name */
    ctx.font=`700 ${Math.min(12,W*0.019)}px "Space Mono",monospace`;
    ctx.fillStyle=dieColor+'99'; ctx.fillText(mName,cx,nextY); nextY+=18;
    /* divider */
    ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(cx-120,nextY,240,1); nextY+=12;
    /* cause */
    const mSz=Math.min(17,W*0.027);
    ctx.font=`700 ${mSz}px "Space Mono",monospace`;
    ctx.fillStyle='#000'; ctx.fillText(deathMsg,cx+2,nextY+2);
    ctx.fillStyle='#F4F0E6'; ctx.fillText(deathMsg,cx,nextY); nextY+=mSz+6;
    /* quip */
    if (deathQuip) {
      const qSz=Math.min(11,W*0.017);
      ctx.font=`700 ${qSz}px "Space Mono",monospace`;
      ctx.fillStyle=MODE==='time'?'rgba(80,160,255,0.82)':MODE==='dark'?'rgba(200,80,120,0.80)':'rgba(255,130,50,0.80)';
      ctx.fillText(`"${deathQuip}"`,cx,nextY); nextY+=qSz+10;
    }
    nextY+=6;
    /* stats block */
    const sSz=Math.min(14,W*0.022);
    ctx.font=`700 ${sSz}px "Space Mono",monospace`;
    ctx.fillStyle='rgba(244,240,230,0.50)';
    ctx.fillText(`survived  ${score.toFixed(1)}s`,cx,nextY); nextY+=sSz+5;
    ctx.fillText(`signal  ${Math.floor(score*10)}`,cx,nextY); nextY+=sSz+4;
    if (best>0) { ctx.fillStyle='#F2B544'; ctx.fillText(`best  ${Math.floor(best*10)}`,cx,nextY); }
    nextY+=sSz+18;
    /* RE-ENTER button */
    const bW=Math.min(300,W*0.58), bH=52, bX=cx-bW/2;
    btn={x:bX,y:nextY,w:bW,h:bH};
    ctx.fillStyle='#000'; ctx.fillRect(bX+4,nextY+4,bW,bH);
    ctx.fillStyle=dieColor; ctx.fillRect(bX,nextY,bW,bH);
    ctx.strokeStyle='#000'; ctx.lineWidth=2.5; ctx.strokeRect(bX,nextY,bW,bH);
    ctx.fillStyle='#000'; ctx.font=`${Math.min(20,W*0.032)}px "Bangers",cursive`;
    ctx.fillText('RE-ENTER THE VOID',cx,nextY+34); nextY+=bH+10;
    /* CHANGE DIMENSION button */
    btn2={x:bX,y:nextY,w:bW,h:bH};
    ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(bX,nextY,bW,bH);
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=2; ctx.strokeRect(bX,nextY,bW,bH);
    ctx.fillStyle='rgba(255,255,255,0.65)'; ctx.font=`${Math.min(20,W*0.032)}px "Bangers",cursive`;
    ctx.fillText('CHANGE DIMENSION',cx,nextY+34);
    ctx.textAlign='left';
  }
}

/* ─── Game loop ────────────────────────────── */
function loop(ts) {
  if (lastTs===null) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.08);
  lastTs=ts; update(dt); draw();
  requestAnimationFrame(loop);
}

/* ─── Initialize ────────────────────────────── */
player.x=canvas.width/2; player.y=canvas.height/2-PH/2;
if (MODE) startMode(MODE);
requestAnimationFrame(loop);
</script>
</body>
</html>
